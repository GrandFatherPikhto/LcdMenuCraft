# JSON Schema (draft-07) for validating the menu tree (menu.yaml).
# Written in YAML for consistency; jsonschema works with dict.

$schema: "http://json-schema.org/draft-07/schema#"
type: object
properties:
  config:
    $ref: '#/$defs/configItems'
  menu:
    type: array
    items:
      $ref: '#/$defs/menuItem'
required: [menu, config]
$defs:
  controlType:
    type: string
    enum: [click, position]
    description: Element control type
  navigateType:
    type: string
    enum: [cyclic, limit]
    description: Navigation type between elements
  dataType:
    type: string
    enum: [byte, ubyte, word, uword, dword, udword, float, string, callback]
    description: Data types
  roleType:
    type: string
    enum: [simple, factor, fixed, callback]
    description: "Data management: simple, factor, fixed set, callback function"
  outputDirectory:
    type: string
    description: Directory where *.c and *.h files are generated from templates
  includeFiles:
    type: array
    items:
      type: string
    description: List of files to include in the generated menu_data_config.c
  wrapByNameFunctions:
    type: boolean
    description: Generate wrapper functions to get data by node name
  enableNodeNames:
    type: boolean
    description: Build a static list of menu node names for debugging
  configItems:
    type: object
    properties:
      version:
        type: string
        pattern: '^\d+\.\d+$'
      author:
        type: string
        minLength: 1
      default_navigate:
        $ref: '#/$defs/navigateType'
      default_control:
        $ref: '#/$defs/controlType'
      root_navigate:
        $ref: '#/$defs/navigateType'
      default_branch_navigate:
        $ref: '#/$defs/navigateType'
      output_directory:
        $ref: '#/$defs/outputDirectory'
      include_files:
        $ref: '#/$defs/includeFiles'
      wrap_by_name_functions:
        $ref: '#/$defs/wrapByNameFunctions'
      enable_node_names:
        $ref: '#/$defs/enableNodeNames'
    additionalProperties: false
  menuItem:
    type: object
    properties:
      id:
        type: string
        pattern: '^[a-zA-Z0-9_]+$'
      title:
        type: string
        minLength: 1
      type:
        $ref: '#/$defs/dataType'
      role:
        $ref: '#/$defs/roleType'
      controls:
        type: array
        items:
          $ref: '#/$defs/controlType'
        minItems: 1
        uniqueItems: true
        description: List of allowed control types for the element
      navigate:
        $ref: '#/$defs/navigateType'
      click_cb:
        type: string
        description: Custom click handler function
      position_cb:
        type: string
        description: Custom encoder position handler function
      double_click_cb:
        type: string
        description: Custom double-click handler function
      long_click_cb:
        type: string
        description: Custom long-click handler function
      event_cb:
        type: string
        description: Custom menu event handler function
      draw_value_cb:
        type: string
        description: Custom value drawing function
      tag:
        type: integer
        description: Arbitrary static metadata (e.g. hardware register id), exposed read-only as ctx->configs[id].tag
      default:
        type: [number, string]
      min:
        type: number
      max:
        type: number
      step:
        type: number
        minimum: 0
      values:
        type: array
        items:
          type: [string, number]
        minItems: 1
      raw_values:
        type: array
        items:
          type: integer
        minItems: 1
        description: >
          Optional, role: fixed only. Actual values corresponding 1:1 to `values`
          by index. If set, menu_get_int32()/menu_set_int32() operate on this
          array instead of the raw idx. Must be the same length as `values`.
      default_idx:
        type: integer
        minimum: 0
      factors:
        type: array
        items:
          type: number
        minItems: 1
      str_true:
        type: string
      str_false:
        type: string
      items:
        type: array
        items:
          $ref: '#/$defs/menuItem'
    additionalProperties: false
    required: [id, title]
    oneOf:
      - properties:
          items:
            type: array
            minItems: 1
        required: [items]
        not:
          required: [type, role]
      - required: [type, role]
        not:
          required: [items]
