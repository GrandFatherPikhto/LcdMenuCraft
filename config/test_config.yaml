# Main configuration file used ONLY by the test suite (see conftest.py).
# Same shape as config.yaml, but points at menu/test.yaml -- a frozen copy
# of the original sample menu tree -- so the suite stays stable regardless
# of edits to the real menu/menu.yaml.
# Paths are relative to this file (the config/ directory).
menu: ../menu/test.yaml
menu_schema: menu_schema.yaml
data_rules: menu_data.yaml
flatten: output/flatterned_test.json
generation_files: files.yaml
