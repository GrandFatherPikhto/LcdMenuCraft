# HIPIMS pulse generator menu tree.
#
# Mirrors the SPI v2 register map of HIPIMS_Generator (spi_regs_pkg.vhd,
# NUM_REGS = 36) as consumed by HiPIMS_Menu (STM32F103C8T6, LL-only). Every
# leaf below that carries a `# reg = N` comment corresponds 1:1 to that
# register address; see D:\Projects\PlatformIO\HiPIMS_Menu\README.md for the
# full protocol description.
#
# Each leaf's `event_cb` is a placeholder for hand-written glue that forwards
# the new value to `hipims_spi_write_reg(reg_addr, value)` and `storage_set`
# — MenuCraft only owns navigation/editing/drawing, it doesn't know about the
# SPI protocol. Not generated automatically; wire these up by hand once the
# C module is generated.
#
# All time-kind fields (period/width/delay/duration) use role: factor with
# factors [50, 500, 5000, 50000] raw cycles (1 LSB = 20ns) — i.e. 1us/10us/
# 100us/1ms per click. No field-level factor goes below 1us: nanosecond
# resolution on a period/width/delay is never needed and only clutters the
# display (2026-08-20, confirmed by Denis) — sub-us resolution is
# deliberately reserved for anode_deadtime alone. anode_deadtime is the one
# exception: role: simple, fixed step 1 = 20ns, since its whole usable range
# is a few hundred to ~2000ns and a coarse factor would overshoot it in a
# single click.

config:
  version: '1.0'
  author: Denis
  default_navigate: limit
  default_control: position
  default_branch_navigate: cyclic
  root_navigate: cyclic
  output_directory: "D:/Projects/PlatformIO/HiPIMS_Menu/src/menu"
  include_files:
  - hipims_spi.h
  wrap_by_name_functions: true
  enable_node_names: true

menu:
- id: enable
  title: Enable
  type: string
  role: fixed
  values: ['Off', 'On']
  default_idx: 0
  navigate: cyclic
  event_cb: hipims_on_value_changed   # reg = 0 (REG_ENABLE)

- id: start
  title: Start
  type: string
  role: fixed
  values: ['Off', 'On']
  default_idx: 0
  navigate: cyclic
  event_cb: hipims_on_value_changed    # reg = 1 (REG_START)

- id: options
  title: Options
  navigate: limit
  items:

  - id: period
    title: Period
    type: dword
    role: factor
    draw_value_cb: hipims_draw_time_value_cb
    default: 0
    min: 0
    max: 8338607        # MAX_PERIOD_CYCLES (2^23-1 minus pre/post margin)
    factors: [50, 500, 5000, 50000]
    event_cb: hipims_on_value_changed # reg = 2 (REG_PERIOD)

  - id: leg_a
    title: Leg A
    items:
    - id: leg_a_width
      title: Width
      type: dword
      role: factor
      draw_value_cb: hipims_draw_time_value_cb
      default: 0
      min: 0
      max: 8388607      # TIME_WIDTH_MAX (2^23-1)
      factors: [50, 500, 5000]
      event_cb: hipims_on_value_changed # reg = 3 (REG_LEGA_WIDTH)

  - id: leg_b
    title: Leg B
    items:
    - id: leg_b_enable
      title: Enable
      type: string
      role: fixed
      values: ['Off', 'On']
      default_idx: 0
      navigate: cyclic
      event_cb: hipims_on_value_changed # reg = 4 (REG_LEGB_ENABLE)
    - id: leg_b_delay
      title: Delay
      type: dword           # signed int32_t (fixed 2026-08-19)
      role: factor
      draw_value_cb: hipims_draw_time_value_cb
      default: 0
      min: -25000        # -MARGIN_CYCLES (-500us pre-trigger)
      max: 8413607       # TIME_WIDTH_MAX + MARGIN_CYCLES
      factors: [50, 500, 5000, 50000]
      event_cb: hipims_on_value_changed # reg = 5 (REG_LEGB_DELAY)
    - id: leg_b_width
      title: Width
      type: dword
      role: factor
      draw_value_cb: hipims_draw_time_value_cb
      default: 0
      min: 0
      max: 8388607
      factors: [50, 500, 5000, 50000]
      event_cb: hipims_on_value_changed # reg = 6 (REG_LEGB_WIDTH)

  - id: channel_0
    title: Channel 0
