  role: callback
  draw_value_cb: hipims_errors_draw_cb   # renders "A: OK/FLT  B: OK/FLT"
  click_cb: hipims_fault_reset_cb        # click = manual REG_ENABLE 0->1 reset,
                                          # not "enter edit" — see
                                          # hipims_fault_reset() in the firmware
